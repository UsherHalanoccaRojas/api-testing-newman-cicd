name: CI/CD Pipeline - API Testing & Automated Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run API Automated Tests (Newman)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Start API Server in Background
        run: |
          npm start &
          npx wait-on http://localhost:3000/health --timeout 15000

      - name: Execute Postman Suite with Newman CLI
        run: |
          npx newman run tests/postman/task_api_collection.json \
            -e tests/postman/postman_environment.json \
            --reporters cli,json \
            --reporter-json-export newman-report.json

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-test-report
          path: newman-report.json

  deploy:
    name: Deploy to Public Cloud SaaS (Render)
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Webhook
        run: |
          echo "🚀 Desplegando en la nube pública (Render SaaS)..."
          # El webhook de Render se dispara automáticamente al aprobar los tests
          # curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Despliegue completado con éxito a través de automatización CI/CD."

